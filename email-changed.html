<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Updated – San Marco Pizza</title>
  <meta name="description" content="Your San Marco Pizza login email has been updated.">
  <meta name="theme-color" content="#C8402F">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍕</text></svg>">
  <style>
    :root {
      --cream: #F5EFE0;
      --ink: #2b2620;
      --muted: #6f6555;
      --tomato: #C8402F;
      --tomato-dark: #A32D20;
      --basil: #4C7A34;
      --card: #fffdf8;
      --line: #e7ddc8;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--cream);
      color: var(--ink);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex; align-items: center; gap: 10px;
      padding: 48px 20px 0; max-width: 680px; margin: 0 auto; width: 100%;
    }
    .logo { font-size: 26px; }
    .brand { font-size: 15px; font-weight: 700; letter-spacing: .3px; color: var(--basil); text-transform: uppercase; }
    main {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 40px 20px;
    }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 20px; padding: 40px 32px;
      max-width: 420px; width: 100%; text-align: center;
    }
    .check {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--basil); display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px; box-shadow: 0 8px 20px rgba(76, 122, 52, .25);
    }
    h1 { font-size: 28px; margin-bottom: 12px; }
    .card p { font-size: 16px; color: var(--muted); }
    footer {
      padding: 20px; text-align: center; color: var(--muted); font-size: 14px;
    }
    footer a { color: var(--tomato-dark); text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <span class="logo" aria-hidden="true">🍕</span>
    <span class="brand">San Marco Pizza</span>
  </header>

  <main>
    <div class="card">
      <div class="check" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fffdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <h1>Email confirmed</h1>
      <p>This step of your email change is done. If your pizzeria's app asked you to confirm from both your old and new address, check the other inbox too — otherwise you're all set.</p>
    </div>
  </main>

  <footer>
    <a href="index.html">Home</a>
  </footer>
</body>
</html>
